name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
        env:
          CHATUI_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
      - name: Print snapshots (base64, for tooling without artifact access)
        if: always()
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/snapshots/*.png; do
            echo "SNAPSHOT-BEGIN $(basename "$f")"
            base64 -i "$f" | tr -d '\n'
            echo
            echo "SNAPSHOT-END"
          done
